  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace; }
    .cap  { font-size: 11px; letter-spacing: 2px; fill: #8B949E; }
    .power{ animation: glow 2.4s ease-in-out infinite; }

    @keyframes glow { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes bx1  { from { transform: translateX(0) } to { transform: translateX(578px) } }
    @keyframes by1  { from { transform: translateY(0) } to { transform: translateY(148px) } }

    .x1 { animation: bx1 13s linear infinite alternate -2s; }
    .x2 { animation: bx1 15s linear infinite alternate -4s; }
    .x3 { animation: bx1 19s linear infinite alternate -6s; }
    .x4 { animation: bx1 9s  linear infinite alternate -1s; }
    .x5 { animation: bx1 23s linear infinite alternate -8s; }
    .x6 { animation: bx1 11s linear infinite alternate -3s; }
    .x7 { animation: bx1 17s linear infinite alternate -5s; }
    .x8 { animation: bx1 21s linear infinite alternate -9s; }
    .x9 { animation: bx1 14s linear infinite alternate -7s; }

    .y1 { animation: by1 17s linear infinite alternate -5s; }
    .y2 { animation: by1 11s linear infinite alternate -1s; }
    .y3 { animation: by1 14s linear infinite alternate -9s; }
    .y4 { animation: by1 21s linear infinite alternate -3s; }
    .y5 { animation: by1 13s linear infinite alternate -2s; }
    .y6 { animation: by1 18s linear infinite alternate -7s; }
    .y7 { animation: by1 9s  linear infinite alternate -4s; }
    .y8 { animation: by1 15s linear infinite alternate -6s; }
    .y9 { animation: by1 19s linear infinite alternate -8s; }

    @media (prefers-reduced-motion: reduce) {
      [class^="x"], [class^="y"] { animation: none !important; }
    }
  </style>

