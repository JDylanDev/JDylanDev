<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="Toolbox: C, Python, Java, JavaScript, HTML, CSS, Godot, Git, VS Code bouncing on a TV screen">
