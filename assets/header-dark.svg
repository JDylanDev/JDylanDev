<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="JDylanDev — CS student">
  <title>JDylanDev</title>

  <defs>
    <pattern id="hd-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <clipPath id="hd-card"><rect width="640" height="170" rx="14"/></clipPath>
    <clipPath id="hd-type"><rect class="typemask" x="36" y="112" width="470" height="24"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace; }
    .name { font-size: 52px; font-weight: 700; letter-spacing: 0.5px; fill: #E6EDF3; }
    .sub  { font-size: 17px; fill: #8B949E; }
    .tag  { font-size: 11px; fill: #8B949E; letter-spacing: 3px; }
    .accent { fill: #D29922; }
    .glyph { font-size: 92px; font-weight: 700; fill: #161B22; }

    .caret    { animation: blink 1.05s steps(1) infinite; }
    .typemask { animation: type 6s steps(38) infinite; }
    .drift    { animation: drift 7s ease-in-out infinite; }

    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes type  { 0% { transform: translateX(-470px) } 55%, 100% { transform: translateX(0) } }
    @keyframes drift { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }

    @media (prefers-reduced-motion: reduce) {
      .caret, .typemask, .drift { animation: none }
      .typemask { transform: translateX(0) }
    }
  </style>

  <g clip-path="url(#hd-card)">
    <rect width="640" height="170" fill="#0D1117"/>
    <rect width="640" height="170" fill="url(#hd-grid)"/>

    <text class="mono glyph drift" x="616" y="140" text-anchor="end">&#123;&#125;</text>

    <text class="mono tag" x="606" y="40" text-anchor="end">CS STUDENT</text>
    <text class="mono name" x="36" y="92">JDylan<tspan class="accent">Dev</tspan><tspan class="accent caret">_</tspan></text>

    <g clip-path="url(#hd-type)">
      <text class="mono sub" x="36" y="130"><tspan class="accent">~/</tspan> things that probably shouldn't work</text>
    </g>

    <rect width="640" height="170" rx="14" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
